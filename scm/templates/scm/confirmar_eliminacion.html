{% extends 'crm/base.html' %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 text-center p-4">
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                </div>
                <h4 class="fw-bold text-dark">¿Estás seguro?</h4>
                <p class="text-muted mb-4">
                    Estás a punto de eliminar el {{ tipo|lower }}: <br>
                    <strong class="text-dark fs-5">{{ objeto }}</strong>
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url url_cancelar %}" class="btn btn-light fw-semibold px-4">Cancelar</a>
                        <button type="submit" class="btn btn-danger fw-semibold px-4">
                            <i class="bi bi-trash3-fill me-1"></i> Sí, eliminar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
