{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoWeb CRM - Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="d-flex align-items-center vh-100 bg-light">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card soweb-card p-4 border-0 shadow-sm rounded-3">
                    <div class="card-body">
                        <!-- Branding SoWeb -->
                        <div class="text-center mb-4">
                            <span class="brand-badge mb-2 d-inline-block">SOWEB CRM</span>
                            <h3 class="fw-bold text-dark mb-1"><i class="bi bi-box-seam-fill me-2 text-primary"></i>SoWeb</h3>
                            <p class="text-muted small">Plataforma de Gestión de Clientes</p>
                        </div>

                        {% if form.errors %}
                            <div class="alert alert-danger border-0 rounded-3 small mb-3">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>Usuario o contraseña incorrectos.
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label text-secondary small fw-medium">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control border-start-0 bg-light" placeholder="Tu usuario" required autofocus>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label text-secondary small fw-medium">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                    <input type="password" name="password" class="form-control border-start-0 bg-light" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-soweb-primary w-100">
                                Iniciar Sesión <i class="bi bi-arrow-right-short ms-1"></i>
                            </button>
                        </form>

                        <!-- Enlace para Registro -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted small">¿No tienes cuenta?</span>
                            <a href="{% url 'registrar_usuario' %}" class="text-primary text-decoration-none small fw-bold ms-1">Regístrate</a>
                        </div>
                    </div>
                </div>
                <!-- Footer pequeño -->
                <p class="text-center text-muted small mt-4">© SoWeb CRM • Todos los derechos reservados</p>
            </div>
        </div>
    </div>

</body>
</html>
