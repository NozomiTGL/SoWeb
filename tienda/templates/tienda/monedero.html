{% extends 'crm/base_cliente.html' %}

{% block content %}
<div class="py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 text-center bg-primary text-white">
                <i class="bi bi-wallet2 display-4 mb-2"></i>
                <h5 class="text-white-50">Saldo Disponible en Monedero</h5>
                <h1 class="fw-bold display-5">${{ monedero.saldo_actual }}</h1>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3 shadow-sm" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h5 class="fw-bold mb-4">Opciones de Recarga</h5>

                <ul class="nav nav-pills nav-fill mb-3" id="pills-tab" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active rounded-pill" id="tab-tarjeta" data-bs-toggle="pill" data-bs-target="#pills-tarjeta" type="button">
                            <i class="bi bi-credit-card me-1"></i> Tarjeta de Débito/Crédito
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link rounded-pill" id="tab-codigo" data-bs-toggle="pill" data-bs-target="#pills-codigo" type="button">
                            <i class="bi bi-ticket-perforated me-1"></i> Código de Regalo
                        </button>
                    </li>
                </ul>

                <div class="tab-content pt-3" id="pills-tabContent">
                    <!-- Recarga con Tarjeta Simulada -->
                    <div class="tab-pane fade show active" id="pills-tarjeta">
                        <form action="{% url 'recargar_monedero' %}" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="tipo_recarga" value="tarjeta">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Monto a recargar ($)</label>
                                <input type="number" step="0.01" min="1" name="monto" class="form-control rounded-3" placeholder="Ej: 500.00" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Número de Tarjeta (16 dígitos)</label>
                                <input type="text" name="num_tarjeta" maxlength="16" class="form-control rounded-3" placeholder="4532 0000 0000 0000" required>
                            </div>
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Vencimiento</label>
                                    <input type="text" placeholder="MM/AA" maxlength="5" class="form-control rounded-3" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold">CVV</label>
                                    <input type="password" maxlength="3" placeholder="123" class="form-control rounded-3" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary rounded-pill w-100 fw-semibold">Procesar Recarga</button>
                        </form>
                    </div>

                    <!-- Recarga con Código de Regalo -->
                    <div class="tab-pane fade" id="pills-codigo">
                        <form action="{% url 'recargar_monedero' %}" method="POST">
                            {% csrf_token %}
                            <input type="hidden" name="tipo_recarga" value="codigo">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Ingresa tu Código Prepago</label>
                                <input type="text" name="codigo" class="form-control text-uppercase rounded-3" placeholder="SOWEB-1000-GIFT" required>
                            </div>
                            <button type="submit" class="btn btn-success rounded-pill w-100 fw-semibold">Canjear Código</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
