{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoWeb - Catálogo de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-soweb py-3 mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
          <i class="bi bi-box-seam-fill text-primary"></i>
          <span>SoWeb <span class="text-primary fs-6">Servicios</span></span>
        </a>

        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto ms-lg-4">
            <li class="nav-item">
              <a class="nav-link px-3 active" href="{% url 'catalogo_clientes' %}">
                <i class="bi bi-shop me-1"></i> Nuestro Catálogo
              </a>
            </li>
          </ul>

          <div class="d-flex align-items-center gap-3">
            <div class="text-end d-none d-lg-block">
              <small class="text-muted d-block leading-none">Bienvenido,</small>
              <span class="text-white fw-semibold small">{{ user.first_name|default:user.username }}</span>
            </div>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm rounded-3">
                <i class="bi bi-box-arrow-right me-1"></i> Salir
              </button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <main class="container flex-grow-1">
      {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-top py-3 mt-5">
      <div class="container text-center text-muted small">
        © 2026 <strong>SoWeb</strong> • Catálogo de Servicios para Clientes
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
