{% extends 'crm/base.html' %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="soweb-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-dark mb-0">{{ titulo }}</h3>
                <a href="{% url 'lista_usuarios' %}" class="btn btn-sm btn-soweb-outline">
                    <i class="bi bi-arrow-left me-1"></i> Volver
                </a>
            </div>

            <form method="post">
                {% csrf_token %}
                
                {% if not usuario_target %}
                <div class="mb-3">
                    <label class="form-label small text-secondary fw-semibold">Nombre de Usuario (Login)</label>
                    <input type="text" name="username" class="form-control bg-light" required placeholder="Ej. vendedor2">
                </div>
                {% endif %}

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small text-secondary fw-semibold">Nombre(s)</label>
                        <input type="text" name="first_name" value="{{ usuario_target.first_name|default:'' }}" class="form-control bg-light" placeholder="Ej. Carlos">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-secondary fw-semibold">Apellidos</label>
                        <input type="text" name="last_name" value="{{ usuario_target.last_name|default:'' }}" class="form-control bg-light" placeholder="Ej. Gómez">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small text-secondary fw-semibold">Correo Electrónico</label>
                    <input type="email" name="email" value="{{ usuario_target.email|default:'' }}" class="form-control bg-light" placeholder="carlos@soweb.com">
                </div>

                <div class="mb-3">
                    <label class="form-label small text-secondary fw-semibold">
                        {% if usuario_target %}Nueva Contraseña (dejar en blanco para no cambiar){% else %}Contraseña{% endif %}
                    </label>
                    <input type="password" name="password" class="form-control bg-light" {% if not usuario_target %}required{% endif %} placeholder="••••••••">
                </div>

                <div class="p-3 bg-light rounded-3 mb-4">
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" name="is_staff" id="is_staff" {% if usuario_target.is_staff %}checked{% endif %}>
                        <label class="form-check-label small fw-semibold text-dark" for="is_staff">Permisos de Administrador (Staff)</label>
                    </div>
                    {% if usuario_target %}
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if usuario_target.is_active %}checked{% endif %}>
                        <label class="form-check-label small fw-semibold text-dark" for="is_active">Usuario Activo (Permite iniciar sesión)</label>
                    </div>
                    {% endif %}
                </div>

                <button type="submit" class="btn btn-soweb-primary w-100">
                    <i class="bi bi-check-circle-fill me-1"></i> Guardar Trabajador
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
