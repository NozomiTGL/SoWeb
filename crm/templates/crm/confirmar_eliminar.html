{% extends 'crm/base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="soweb-card p-4 text-center">
            <div class="icon-box bg-danger bg-opacity-10 text-danger mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.75rem;">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            
            <h4 class="fw-bold text-dark mb-2">Eliminar Cliente</h4>
            <p class="text-muted small mb-4">
                ¿Estás seguro de que deseas eliminar permanentemente a <strong>{{ cliente.nombre }}</strong>? Esta acción borrará también todo su historial de interacciones.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'lista_clientes' %}" class="btn btn-soweb-outline">Cancelar</a>
                    <button type="submit" class="btn btn-danger rounded-3 px-4 fw-medium">
                        <i class="bi bi-trash me-1"></i> Confirmar Eliminación
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
