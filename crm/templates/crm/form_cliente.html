{% extends 'crm/base.html' %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-8 col-lg-6">
        <div class="soweb-card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold text-dark mb-0">{{ titulo }}</h3>
                <a href="{% url 'lista_clientes' %}" class="btn btn-sm btn-soweb-outline">
                    <i class="bi bi-arrow-left me-1"></i> Volver
                </a>
            </div>

            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label small text-secondary fw-semibold">Nombre del Cliente / Contacto</label>
                    <input type="text" name="nombre" value="{{ cliente.nombre|default:'' }}" class="form-control bg-light" required placeholder="Ej. Ana Martínez">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small text-secondary fw-semibold">Correo Electrónico</label>
                        <input type="email" name="correo" value="{{ cliente.correo|default:'' }}" class="form-control bg-light" required placeholder="ana@empresa.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-secondary fw-semibold">Teléfono</label>
                        <input type="text" name="telefono" value="{{ cliente.telefono|default:'' }}" class="form-control bg-light" placeholder="Ej. 4491234567">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small text-secondary fw-semibold">Empresa / Negocio</label>
                    <input type="text" name="empresa" value="{{ cliente.empresa|default:'' }}" class="form-control bg-light" placeholder="Ej. Soluciones Web SA">
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small text-secondary fw-semibold">Estado General</label>
                        <select name="estado" class="form-select bg-light">
                            <option value="activo" {% if cliente.estado == 'activo' %}selected{% endif %}>Activo</option>
                            <option value="inactivo" {% if cliente.estado == 'inactivo' %}selected{% endif %}>Inactivo</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small text-secondary fw-semibold">Etapa CRM</label>
                        <select name="etapa_crm" class="form-select bg-light">
                            <option value="prospecto" {% if cliente.etapa_crm == 'prospecto' %}selected{% endif %}>Prospecto</option>
                            <option value="activo" {% if cliente.etapa_crm == 'activo' %}selected{% endif %}>Activo</option>
                            <option value="frecuente" {% if cliente.etapa_crm == 'frecuente' %}selected{% endif %}>Frecuente</option>
                            <option value="inactivo" {% if cliente.etapa_crm == 'inactivo' %}selected{% endif %}>Inactivo</option>
                        </select>
                    </div>
                </div>

                <!-- Selección de Vendedor Asignado (Solo visible para Administradores) -->
                {% if user.is_staff and vendedores %}
                <div class="mb-4 p-3 bg-light rounded-3 border">
                    <label class="form-label small text-primary fw-bold mb-1">
                        <i class="bi bi-person-badge me-1"></i> Asignar Vendedor Responsable
                    </label>
                    <select name="vendedor" class="form-select border-0 shadow-sm">
                        {% for v in vendedores %}
                            <option value="{{ v.pk }}" {% if cliente.vendedor == v or not cliente and user == v %}selected{% endif %}>
                                {{ v.username }} ({% if v.get_full_name %}{{ v.get_full_name }}{% else %}Vendedor{% endif %})
                            </option>
                        {% endfor %}
                    </select>
                    <small class="text-muted mt-1 d-block" style="font-size: 0.75rem;">
                        Como administrador puedes asignar o cambiar el vendedor encargado de este proyecto.
                    </small>
                </div>
                {% endif %}

                <button type="submit" class="btn btn-soweb-primary w-100">
                    <i class="bi bi-check-circle-fill me-1"></i> Guardar Cliente
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
