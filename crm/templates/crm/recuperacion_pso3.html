{% extends 'crm/base_cliente.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg rounded-4 p-4">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill text-success mb-2" style="font-size: 3rem;"></i>
                <h4 class="fw-bold">Crear Nueva Contraseña</h4>
            </div>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible small p-2">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Nueva Contraseña</label>
                    <input type="password" name="nueva_password" class="form-control rounded-3" minlength="8" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Confirmar Contraseña</label>
                    <input type="password" name="confirmacion" class="form-control rounded-3" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold">
                    Guardar y Finalizar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
